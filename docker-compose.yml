version: "3.8"

networks:
  custom_network:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    restart: always
    networks:
      - custom_network

  sast1:
    container_name: sast1
    build:
      context: ./task_management/taskqi
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    restart: always
    depends_on:
      - rabbitmq
    networks:
      - custom_network

  redis_test:
    image: redis/redis-stack:latest
    container_name: redis_test
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight_container
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - redis_test

  postgres_test:
    container_name: postgres_test
    image: pgvector/pgvector:pg17
    ports:
      - "5435:5432"
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data

volumes:
  # postgres_data:
  redis_data:
