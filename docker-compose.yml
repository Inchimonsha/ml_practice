version: "3.8"

networks:
  custom_network:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    restart: always
    networks:
      - custom_network

  sast1:
    container_name: sast1
    build:
      context: ./task_management/taskqi
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    restart: always
    depends_on:
      - rabbitmq
    networks:
      - custom_network
